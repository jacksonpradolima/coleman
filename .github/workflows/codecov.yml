name: Run tests and upload coverage and analytics

on:
  push:
    branches-ignore:
      - qualification/v5-372-uploader-success
      - qualification/v5-372-uploader-failure
    # Preserve the original push workflow for every tag as well as other branches.
    tags: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Run ${{ github.event_name }} tests and collect coverage
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.14']
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Install verified uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.13.1'
          checksum: eadd9d27c134ab5ac1ffd4473b97a741407f3ea238288f03121fc4deddf90220
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Create venv
        # The runner's system Python can link an unqualified SQLite release.
        # Use uv's managed distribution; verify the actual engine below.
        run: uv venv .venv --python 3.14 --managed-python
      - name: Install dependencies
        run: |
          uv sync --frozen --extra ci --extra analytics --extra dev --extra mcp --extra telemetry --extra release --group build --no-build --no-install-project
          uv pip install --no-deps --no-build --no-build-isolation --editable .
      - name: Qualify linked SQLite runtime
        run: |
          .venv/bin/python - <<'PY'
          import sqlite3
          import sys
          from coleman.state._disk import qualify_sqlite

          print(f'Python: {sys.version}; executable: {sys.executable}')
          print(f'Linked SQLite: {sqlite3.sqlite_version}')
          qualify_sqlite()
          PY
      - name: Run tests
        # Keep installed-package modules together. Collect partial coverage here;
        # the serial completion below enforces the unchanged combined 95% gate.
        run: |
          uv run --frozen --no-sync --no-build python -m pytest -n 4 --dist=loadfile \
            --ignore=tests/corpus/test_installed_public_ci.py \
            --ignore=tests/corpus/test_installed_westermo.py \
            --cov --cov-branch --cov-fail-under=0 \
            --junitxml=junit.xml -o junit_family=legacy
      - name: Complete installed corpus tests and enforce combined coverage
        run: |
          uv run --frozen --no-sync --no-build python -m pytest \
            tests/corpus/test_installed_public_ci.py \
            tests/corpus/test_installed_westermo.py \
            --cov --cov-branch --cov-append --cov-fail-under=95 \
            --junitxml=junit-installed-corpus.xml -o junit_family=legacy
          uv run --frozen --no-sync --no-build coverage json -o coverage-final.json
          uv run --frozen --no-sync --no-build python - <<'PY'
          import json
          from pathlib import Path
          import tomllib
          total = json.loads(Path('coverage-final.json').read_text())['totals']['percent_covered']
          policy = tomllib.loads(Path('pyproject.toml').read_text())['tool']['coverage']['report']
          threshold = policy['fail_under']
          print(f'Raw combined coverage: {total!r}%; fail_under={threshold}; precision={policy["precision"]}')
          accepted = total >= threshold
          print(f'Unrounded coverage policy: {"PASS" if accepted else "FAIL"}')
          raise SystemExit(0 if accepted else 1)
          PY
      - name: Upload coverage to Codecov
        # Reporting is optional; binary verification inside the action is strict.
        continue-on-error: true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: unittests
          name: codecov-coverage-report
      - name: Report and upload test results to Codecov
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: ./.github/actions/report-junit
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          upload-name: coleman-test-results
